[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"

# Single-page app fallback (API routes are handled by the function's own path config)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
